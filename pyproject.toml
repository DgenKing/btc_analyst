[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-analyst"
version = "1.0.0"
description = "Bitcoin-only trading analysis assistant"
requires-python = ">=3.11"
dependencies = [
    "pybit>=5.7",
    "websockets>=12",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta>=0.3.14b",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "plotly>=5.22",
    "kaleido>=0.2.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-telegram-bot>=21",
    "pydantic>=2.7",
    "structlog>=24.1",
    "apscheduler>=3.10",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "responses"]
backtest = ["vectorbt>=0.26", "numba>=0.59"]

[project.scripts]
btc-analyst = "btc_analyst.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
